name: Build Wintermas preview installer

on:
  push:
    branches:
      - fix/persist-weather-autostart-snowballs

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd exec -- install-electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify unit tests before packaging
        shell: pwsh
        run: |
          node --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/overlay.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standard Windows NSIS installer
        shell: pwsh
        run: |
          npm.cmd run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'dist/setup/Wintermas-Setup.exe')) { throw 'Installer missing' }
      - name: Verify EXE, compute SHA-256 and test silent installation
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'dist/setup/Wintermas-Setup.exe').Path
          $file = [System.IO.File]::OpenRead($installer)
          try {
            if ($file.ReadByte() -ne 77 -or $file.ReadByte() -ne 90) {
              throw 'Installer does not contain the Windows MZ executable header'
            }
          } finally { $file.Dispose() }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.Status -notin @('Valid', 'NotSigned')) {
            throw "Unexpected signature failure: $($signature.Status)"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'dist/setup/Wintermas-Setup.exe.sha256'),
            "$hash  Wintermas-Setup.exe`n", [System.Text.Encoding]::ASCII)
          Write-Host "Installer SHA256: $hash"
          $target = Join-Path $env:RUNNER_TEMP 'Wintermas-Install-Smoke'
          $installerArgs = @('/S', '/currentuser', "/D=$target")
          $process = Start-Process -FilePath $installer -ArgumentList $installerArgs -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS silent install failed: $($process.ExitCode)" }
          if (!(Test-Path (Join-Path $target 'Wintermas.exe'))) {
            throw "NSIS completed but Wintermas.exe is absent from $target"
          }
          Write-Host 'Standard NSIS installer smoke test passed.'
      - name: Upload installer and checksum as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wintermas-Preview-Windows-x64
          path: |
            dist/setup/Wintermas-Setup.exe
            dist/setup/Wintermas-Setup.exe.sha256
          if-no-files-found: error
      - name: Publish preview download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.1-preview.25
        run: |
          gh release create $env:RELEASE_TAG 'dist/setup/Wintermas-Setup.exe' 'dist/setup/Wintermas-Setup.exe.sha256' --target $env:GITHUB_SHA --title 'Wintermas Preview 25 - safe startup and AutoCAD exclusion' --prerelease --notes 'Preview 25: fixes upgrade from older startup:false defaults by a one-time migration; enables Windows login startup using a Wintermas-only shortcut in the current-user Startup folder; leaves other startup applications untouched and removes only the verified legacy Wintermas registry entry. Adds an explicit Launch with Windows toggle and adds acad.exe (AutoCAD) to the bottom effects exclusion beside SLDWORKS.exe, including existing installations. Preserves weather settings, snowballs/snowmen and gentle fullscreen snow dismissal from Preview 24. Windows CI tests and silent installer smoke test. Unsigned preview: do not bypass antivirus warnings.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
