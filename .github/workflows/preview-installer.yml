name: Build Wintermas preview installer

on:
  push:
    branches:
      - fix/separate-weather-and-taskbar-art

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd exec -- install-electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify unit tests before packaging
        shell: pwsh
        run: |
          node --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/overlay.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        shell: pwsh
        run: |
          npm.cmd run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'dist/setup/Wintermas-Setup.exe')) { throw 'Installer missing' }
      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wintermas-Preview-Windows-x64
          path: dist/setup/Wintermas-Setup.exe
          if-no-files-found: error
      - name: Publish preview download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.1-preview.5
        run: |
          gh release create $env:RELEASE_TAG 'dist/setup/Wintermas-Setup.exe' --target $env:GITHUB_SHA --title 'Wintermas 0.2.1 Preview 5' --prerelease --notes 'Preview build with isolated weather, window occlusion, speed controls, snow and snowplough fixes. Windows testing recommended before stable release.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
