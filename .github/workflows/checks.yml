name: JavaScript checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test
      - name: Syntax check
        shell: bash
        run: |
          node --check main.js
          node --check diagnostics.js
          node --check preload.cjs
          find ui -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.js' -print0 | xargs -0 -n1 node --check
